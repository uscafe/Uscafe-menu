<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>US Café Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Alexandria:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, premium, quick to scan — a specialty café's printed menu, made for a phone
   IDEA: the brand's black shield card on a white counter, products lined up like a display shelf
   PICTURE: product shots in US cups on soft tiles; a black brand card with the cup slogan at the top
   COLOUR and TYPE: white, ink #0A0A0A, amber #FFB81C used sparingly; Archivo + Alexandria
   LAYOUT: slim brand bar, black hero card, sticky search + tabs, product grid, bottom sheet for milk */
:root{color-scheme:light;--bg:#FFFFFF;--tile:#F6F5F1;--line:#EBEAE4;--ink:#0A0A0A;--ink2:#2B2B28;--mute:#73746D;--amber:#FFB81C;--r:18px}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:124px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html[lang=ar] body{font-family:Alexandria,Archivo,system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding-inline:max(4vw,16px)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
/* brand bar */
.brand{display:flex;align-items:center;gap:12px;padding-block:16px}
.brand img{width:34px;height:auto;display:block}
.brand b{display:block;font-size:19px;font-weight:900;letter-spacing:-.01em;line-height:1.1}
.brand span{display:block;font-size:12.5px;color:var(--mute)}
.lang{margin-inline-start:auto;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;cursor:pointer}
.lang:hover{border-color:var(--ink)}
/* hero card */
.hero{position:relative;overflow:hidden;border-radius:24px;background:var(--ink);color:#fff;padding:28px 26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;animation:rise .7s both}
.hero h1{margin:0;font-size:clamp(28px,6.4vw,44px);line-height:1.05;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero p{margin:10px 0 0;color:#BDBDB5;font-size:15px;max-width:42ch}
.hero .stats{display:flex;gap:18px;margin-top:18px;flex-wrap:wrap}
.hero .stats div{font-size:13px;color:#BDBDB5}
.hero .stats strong{display:block;color:#fff;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.hero .mark{width:clamp(70px,16vw,120px);height:auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.5))}
.hero::after{content:"";position:absolute;inset:auto -10% -60% 40%;height:120%;background:radial-gradient(closest-side,rgba(255,184,28,.18),transparent);pointer-events:none}
/* sticky bar */
.bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin-top:18px}
.bar>.wrap{padding-top:10px}
.search{position:relative;display:block}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--tile);color:var(--ink);font:inherit;font-size:16px;padding-inline:42px;outline:none;transition:border-color .2s,background .2s}
.search input:focus{border-color:var(--ink);background:#fff}
.search input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
.search svg{position:absolute;top:12px;inset-inline-start:13px;color:var(--mute)}
.clear{position:absolute;top:0;inset-inline-end:0;width:44px;height:44px;border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer;display:none}
.tabs{position:relative;display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;margin-top:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:46px;border:0;background:none;padding:0 2px;color:var(--mute);font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap;transition:color .2s}
.tab[aria-current=true]{color:var(--ink)}
.line{position:absolute;bottom:0;left:0;height:3px;border-radius:3px 3px 0 0;background:var(--amber);transition:transform .35s cubic-bezier(.3,1.1,.4,1),width .35s cubic-bezier(.3,1.1,.4,1)}
/* sections */
section{padding-top:34px}
.sh{display:flex;align-items:baseline;gap:10px;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
h2{margin:0;font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.count{color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* card */
.card{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:box-shadow .25s,transform .25s,border-color .25s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(10,10,10,.07);border-color:#e0dfd8}
.photo{aspect-ratio:1/1;background:var(--tile);padding:14px 14px 8px}
.photo img{width:100%;height:100%;object-fit:contain;object-position:center bottom;display:block;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card:hover .photo img{transform:scale(1.04)}
.body{display:flex;flex-direction:column;padding:12px 14px 14px;flex:1}
.name{font-weight:700;font-size:15.5px;line-height:1.3}
.desc{margin-top:3px;color:var(--mute);font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.foot{margin-top:auto;padding-top:10px;display:flex;flex-direction:column;gap:8px}
.price{display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.price b{font-size:18px;font-weight:800}
.price small{font-size:12px;color:var(--mute);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg span{display:flex;flex-direction:column;align-items:center;padding:5px 4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.seg span+span{border-inline-start:1px solid var(--line)}
.seg i{font-style:normal;font-size:11px;color:var(--mute);font-weight:600}
.seg b{font-size:15.5px;font-weight:800}
.ask{font-size:13.5px;font-weight:700;color:var(--mute)}
.milkbtn{display:flex;align-items:center;gap:8px;width:100%;height:40px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;text-align:start;transition:border-color .2s,background .2s}
.milkbtn:hover{border-color:var(--ink)}
.milkbtn svg{flex:none;color:var(--ink2)}
.milkbtn .lbl{flex:1;display:flex;flex-direction:column;line-height:1.15;overflow:hidden}
.milkbtn .lbl i{font-style:normal;font-size:10.5px;color:var(--mute);font-weight:600;text-transform:none}
.milkbtn .lbl b{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.milkbtn.set{border-color:var(--ink);background:#FFFBF0}
.badge{position:absolute;top:10px;inset-inline-start:10px;padding:3px 9px;border-radius:999px;background:var(--ink);color:var(--amber);font-size:11.5px;font-weight:800}
mark{background:#FFE7A6;color:inherit;border-radius:3px;padding:0 1px}
.empty{display:none;text-align:center;padding:60px 10px;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:4px}
.note{color:var(--mute);font-size:12.5px;margin:30px 0 0;line-height:1.6}
footer{margin-top:44px;border-top:1px solid var(--line);padding:28px 0 40px}
footer .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
footer img{width:30px}
footer p{margin:0;color:var(--mute);font-size:14px}
footer a{margin-inline-start:auto;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;text-decoration:none}
/* milk sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,10,10,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:51;left:50%;bottom:0;width:min(520px,100%);transform:translate(-50%,105%);background:#fff;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.18);transition:transform .35s cubic-bezier(.2,.9,.2,1)}
.sheet.open{transform:translate(-50%,0)}
@media(min-width:700px){.sheet{bottom:50%;border-radius:22px;transform:translate(-50%,60%) scale(.96);opacity:0;transition:transform .3s,opacity .25s}.sheet.open{transform:translate(-50%,50%) scale(1);opacity:1}}
.grab{width:40px;height:4px;border-radius:4px;background:#ddd;margin:0 auto 12px}
.sheet h3{margin:0;font-size:19px;font-weight:800}
.sheet .for{margin:2px 0 14px;color:var(--mute);font-size:14px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;text-align:start;transition:border-color .15s,background .15s}
.opt:hover{border-color:#cfcec7}
.opt .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #c9c8c1;display:grid;place-items:center;transition:border-color .15s}
.opt .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink);transform:scale(0);transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.opt[aria-checked=true]{border-color:var(--ink);background:#FFFBF0}
.opt[aria-checked=true] .dot{border-color:var(--ink)}
.opt[aria-checked=true] .dot::after{transform:scale(1)}
.opt b{flex:1;font-weight:700;font-size:15px}
.opt small{color:var(--mute);font-size:12.5px;font-weight:600;white-space:nowrap}
.done{margin-top:14px;width:100%;height:50px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
/* motion */
.rv{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.card.rv{transition-delay:calc(var(--i) * 50ms),calc(var(--i) * 50ms),0s,0s,0s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:440px){.hero{padding:22px 20px;border-radius:20px}.body{padding:10px 11px 12px}.name{font-size:14.5px}.desc{font-size:12.5px}h2{font-size:21px}.tabs{gap:18px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

function priceHTML(p,t){
 if(p===null||p===undefined) return `<span class="ask">${t.ask}</span>`;
 if(Array.isArray(p)) return `<div class="seg">${p.map((v,i)=>`<span><i>${t.sizes[i]}</i><b>${v} <small>${t.cur}</small></b></span>`).join("")}</div>`;
 return `<span class="price"><b>${p}</b><small>${t.cur}</small></span>`;
}
const milkIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 2h6v3l2 4v12a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V9l2-4V2Z"/><path d="M7 12h10"/></svg>';
const chev = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>';
function milkBtn(it,t){
 const k = milkSel[it.img], set = k !== undefined, o = MILK[set?k:0];
 return `<button class="milkbtn${set?" set":""}" type="button" data-milk="${it.img}" aria-haspopup="dialog">${milkIcon}<span class="lbl"><i>${t.milk}</i><b>${lang==="ar"?o.ar:o.en}</b></span>${chev}</button>`;
}
function renderStatic(){
 const t = T[lang], items = MENU.reduce((n,c)=>n+c.items.length,0);
 document.documentElement.lang = lang; document.documentElement.dir = lang==="ar" ? "rtl" : "ltr";
 $("t-name").textContent = t.name; $("t-place").textContent = t.place; $("lang").textContent = t.lang;
 $("t-hero").innerHTML = t.hero; $("t-sub").textContent = t.sub; $("q").placeholder = t.ph;
 $("stats").innerHTML = t.stats(items, MENU.length).map(([n,l])=>`<div><strong>${n}</strong>${l}</div>`).join("");
 $("t-note").textContent = t.note; $("t-foot").textContent = t.foot; $("done").textContent = t.done; $("sh-t").textContent = t.milkT;
}
function renderMenu(){
 const t = T[lang], q = query.trim(), ql = q.toLowerCase();
 let total = 0;
 const cats = MENU.map(c=>{
  const list = c.items.filter(it=>!q || it.en.toLowerCase().includes(ql) || it.ar.includes(q) || it.den.toLowerCase().includes(ql) || it.dar.includes(q) || c.en.toLowerCase().includes(ql) || c.ar.includes(q));
  total += list.length; return {c,list};
 }).filter(x=>x.list.length);
 $("menu").innerHTML = cats.map(({c,list})=>`<section id="${c.id}" aria-labelledby="h-${c.id}">
   <div class="sh rv"><h2 id="h-${c.id}">${lang==="ar"?c.ar:c.en}</h2><span class="count">${t.items(list.length)}</span></div>
   <div class="grid">${list.map((it,i)=>{
     const name = lang==="ar"?it.ar:it.en, d = lang==="ar"?it.dar:it.den;
     return `<article class="card rv" style="--i:${i%4}">
       ${NEW_ITEMS.includes(it.img)?`<span class="badge">${t.new}</span>`:""}
       <div class="photo"><img src="img/${it.img}.webp" alt="${esc(name)}" loading="lazy"></div>
       <div class="body"><div class="name">${hi(name,q)}</div><div class="desc">${hi(d,q)}</div>
        <div class="foot">${priceHTML(it.p,t)}${it.milk?milkBtn(it,t):""}</div></div>
     </article>`;}).join("")}</div></section>`).join("");
 $("empty").style.display = total ? "none" : "block";
 if(!total) $("empty").innerHTML = t.empty(esc(q));
 $("tabs").innerHTML = '<span class="line" id="line"></span>' + cats.map(({c})=>`<button class="tab" type="button" data-id="${c.id}">${lang==="ar"?c.ar:c.en}</button>`).join("");
 if(!cats.find(x=>x.c.id===active) && cats[0]) active = cats[0].c.id;
 setActive(active); observe();
}
function setActive(id){
 active = id;
 const tabs = $("tabs"), line = $("line"), b = tabs.querySelector(`[data-id="${id}"]`);
 tabs.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-current", x===b));
 if(!b||!line){ if(line) line.style.width = "0"; return; }
 line.style.width = b.offsetWidth+"px"; line.style.transform = `translateX(${b.offsetLeft}px)`;
 tabs.scrollTo({left: b.offsetLeft - tabs.clientWidth/2 + b.offsetWidth/2});
}
let reveal, spy;
function observe(){
 if(reveal) reveal.disconnect(); if(spy) spy.disconnect();
 reveal = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); reveal.unobserve(e.target); } }),{rootMargin:"0px 0px -5% 0px"});
 document.querySelectorAll(".rv").forEach(el=>reveal.observe(el));
 spy = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) setActive(e.target.id); }),{rootMargin:"-130px 0px -60% 0px"});
 document.querySelectorAll("main section").forEach(s=>spy.observe(s));
}
/* milk sheet */
function openSheet(img){
 const t = T[lang], it = findItem(img); sheetFor = img; lastFocus = document.activeElement;
 $("sh-for").textContent = t.for(lang==="ar"?it.ar:it.en);
 const cur = milkSel[img] ?? 0;
 $("opts").innerHTML = MILK.map((o,i)=>`<button class="opt" type="button" role="radio" aria-checked="${i===cur}" data-i="${i}"><span class="dot"></span><b>${lang==="ar"?o.ar:o.en}</b>${o.extra?`<small>+${o.extra} ${t.cur}</small>`:""}</button>`).join("");
 $("sheet").hidden = false; requestAnimationFrame(()=>{ $("sheet").classList.add("open"); $("scrim").classList.add("open"); });
 setTimeout(()=>{ ($("opts").querySelector('[aria-checked="true"]')||$("done")).focus(); },60);
}
function closeSheet(){
 $("sheet").classList.remove("open"); $("scrim").classList.remove("open");
 setTimeout(()=>{ $("sheet").hidden = true; },320);
 if(lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
 sheetFor = null;
}
function pick(i){
 milkSel[sheetFor] = i;
 $("opts").querySelectorAll(".opt").forEach(b=>b.setAttribute("aria-checked", +b.dataset.i===i));
 const btn = document.querySelector(`[data-milk="${sheetFor}"]`);
 if(btn){ const tmp = document.createElement("div"); tmp.innerHTML = milkBtn(findItem(sheetFor),T[lang]); const nb = tmp.firstElementChild; btn.replaceWith(nb); lastFocus = nb; }
}
$("menu").addEventListener("click",e=>{ const b = e.target.closest("[data-milk]"); if(b) openSheet(b.dataset.milk); });
$("tabs").addEventListener("click",e=>{ const b = e.target.closest(".tab"); if(!b) return; document.getElementById(b.dataset.id).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); setActive(b.dataset.id); });
$("opts").addEventListener("click",e=>{ const b = e.target.closest(".opt"); if(b) pick(+b.dataset.i); });
$("opts").addEventListener("keydown",e=>{ if(!["ArrowDown","ArrowUp"].includes(e.key)) return; e.preventDefault(); const n = MILK.length, cur = milkSel[sheetFor] ?? 0, nx = (cur + (e.key==="ArrowDown"?1:-1) + n) % n; pick(nx); $("opts").children[nx].focus(); });
$("done").addEventListener("click",closeSheet);
$("scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && sheetFor) closeSheet(); });
$("lang").addEventListener("click",()=>{ lang = lang==="en" ? "ar" : "en"; try{localStorage.setItem("us-lang",lang)}catch(e){} renderStatic(); renderMenu(); });
$("q").addEventListener("input",e=>{ query = e.target.value; $("clear").style.display = query ? "block" : "none"; renderMenu(); });
$("clear").addEventListener("click",()=>{ $("q").value = ""; query = ""; $("clear").style.display = "none"; renderMenu(); $("q").focus(); });
const ro = new ResizeObserver(()=>setActive(active)); ro.observe($("tabs"));
renderStatic(); renderMenu();
}
</script>
</body>
</html>
